[project]
name = "clawback-lens-backend"
version = "2.0.0"
description = "Chargeback dispute resolution API with a computer-vision evidence pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
    "rapidfuzz>=3.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.5", "skl2onnx>=1.17", "pillow>=10.4"]
dev = [
    "clawback-lens-backend[train]",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # FastAPI Depends() defaults; typographic dashes in prose

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/", "evals/", "training/", "scripts/"]

[[tool.mypy.overrides]]
module = ["app.rule_engine.*"]
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL (DATABASE_URL)",
    "slow: runs the OCR models",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workflow/worker.py"]

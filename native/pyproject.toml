[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "clawback-native"
version = "1.0.0"
description = "C++ image kernels for the Clawback Lens vision pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
wheel.packages = ["clawback_native"]
